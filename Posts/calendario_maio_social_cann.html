<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Cann — Calendário Editorial Maio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1E1B18;
  --ink-mid: #5C5650;
  --ink-light: #9C9389;
  --cream: #F6F1E9;
  --cream-2: #EDE7DB;
  --cream-3: #E2D9CC;
  --white: #FDFAF5;
  --green: #1B6647;
  --green-2: #2A8A60;
  --green-bg: #E8F3EE;
  --amber: #A8620F;
  --amber-bg: #FDF3E3;
  --blue: #1A4A7A;
  --blue-bg: #E8F0F8;
  --coral: #B83A22;
  --coral-bg: #FCEEE9;
  --purple: #4A3080;
  --purple-bg: #EEEAF8;
  --teal: #1A6060;
  --teal-bg: #E3F0F0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); font-size: 14px; line-height: 1.6; }

/* HEADER */
.site-header {
  background: var(--ink); color: var(--cream);
  padding: 20px 40px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family: 'DM Serif Display', serif; font-size: 22px; letter-spacing: -.02em; }
.logo em { color: #7EC8A0; font-style: normal; }
.header-right { display: flex; gap: 16px; align-items: center; }
.header-stat { text-align: right; }
.header-stat-n { font-size: 18px; font-weight: 600; color: #7EC8A0; }
.header-stat-l { font-size: 10px; color: var(--ink-light); text-transform: uppercase; letter-spacing: .05em; }

/* CONTROLS */
.controls {
  background: var(--cream-2); border-bottom: 0.5px solid var(--cream-3);
  padding: 14px 40px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; top: 64px; z-index: 90;
}
.filter-btn {
  height: 30px; padding: 0 14px; border-radius: 15px;
  border: 0.5px solid var(--cream-3); background: var(--white);
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--ink-mid); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.filter-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.filter-btn:hover:not(.active) { border-color: var(--ink-light); }
.filter-sep { width: 1px; height: 20px; background: var(--cream-3); }
.search-box {
  height: 30px; padding: 0 12px; border-radius: 15px;
  border: 0.5px solid var(--cream-3); background: var(--white);
  font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--ink);
  outline: none; width: 200px;
}
.search-box:focus { border-color: var(--green-2); }

/* LAYOUT */
.main { max-width: 1100px; margin: 0 auto; padding: 32px 40px; }

/* WEEK HEADER */
.week-head {
  display: flex; align-items: center; gap: 12px;
  margin: 32px 0 16px; padding-bottom: 10px;
  border-bottom: 1.5px solid var(--cream-3);
}
.week-num { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--ink-light); }
.week-dates { font-size: 12px; color: var(--ink-light); }
.week-theme { font-size: 13px; font-weight: 500; color: var(--ink-mid); }

/* POST CARD */
.post-card {
  background: var(--white); border: 0.5px solid var(--cream-3);
  border-radius: 12px; margin-bottom: 14px; overflow: hidden;
  transition: box-shadow .2s;
}
.post-card:hover { box-shadow: 0 4px 20px rgba(30,27,24,.08); }
.card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; cursor: pointer; user-select: none;
}
.card-date {
  font-family: 'DM Serif Display', serif; font-size: 24px;
  color: var(--ink-light); min-width: 42px; line-height: 1;
}
.card-meta { flex: 1; }
.card-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
  text-transform: uppercase; letter-spacing: .04em;
}
.tag-ig { background: var(--purple-bg); color: var(--purple); }
.tag-li { background: var(--blue-bg); color: var(--blue); }
.tag-l1 { background: var(--green-bg); color: var(--green); }
.tag-l2 { background: var(--amber-bg); color: var(--amber); }
.tag-l3 { background: var(--teal-bg); color: var(--teal); }
.tag-l4 { background: var(--coral-bg); color: var(--coral); }
.card-toggle {
  font-size: 18px; color: var(--ink-light); transition: transform .2s;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
}
.card-toggle.open { transform: rotate(180deg); }

/* CARD BODY */
.card-body { display: none; border-top: 0.5px solid var(--cream-3); }
.card-body.open { display: block; }
.card-section { padding: 18px 20px; border-bottom: 0.5px solid var(--cream-3); }
.card-section:last-child { border-bottom: none; }
.section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-light); margin-bottom: 12px;
}
/* CARDS GRID */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.post-slide {
  background: var(--cream); border: 0.5px solid var(--cream-3);
  border-radius: 8px; padding: 14px;
}
.slide-num { font-size: 10px; font-weight: 600; color: var(--ink-light); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.slide-text { font-size: 13px; color: var(--ink); line-height: 1.6; }
/* LEGENDA / HASHTAGS */
.legenda-box {
  background: var(--cream); border-left: 3px solid var(--green);
  border-radius: 0 8px 8px 0; padding: 14px 16px; margin-top: 0;
}
.legenda-text { font-size: 13px; color: var(--ink-mid); line-height: 1.7; white-space: pre-line; }
.hashtags { margin-top: 10px; font-size: 12px; color: var(--green); line-height: 1.8; }
/* COPY BUTTON */
.copy-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.copy-btn {
  height: 30px; padding: 0 14px; border-radius: 6px;
  border: 0.5px solid var(--cream-3); background: var(--cream-2);
  font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--ink-mid);
  cursor: pointer; transition: all .15s;
}
.copy-btn:hover { background: var(--cream-3); }
.copy-btn.copied { background: var(--green-bg); color: var(--green); border-color: var(--green); }
/* STATUS */
.status-row { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--cream); border-top: 0.5px solid var(--cream-3); }
.status-label { font-size: 11px; color: var(--ink-light); }
.status-btn {
  height: 26px; padding: 0 12px; border-radius: 13px; font-size: 11px; font-weight: 500;
  border: 0.5px solid var(--cream-3); background: var(--white); color: var(--ink-mid);
  cursor: pointer; transition: all .15s;
}
.status-btn.done { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.status-btn.prod { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
.no-results { text-align: center; padding: 60px; color: var(--ink-light); font-size: 15px; }
</style>
</head>
<body>

<div class="site-header">
  <div class="logo">Social<em>Cann</em></div>
  <div class="header-right">
    <div class="header-stat"><div class="header-stat-n" id="hTotal">18</div><div class="header-stat-l">Posts em maio</div></div>
    <div class="header-stat"><div class="header-stat-n" id="hDone">0</div><div class="header-stat-l">Concluídos</div></div>
  </div>
</div>

<div class="controls">
  <button class="filter-btn active" onclick="filter('todos',this)">Todos</button>
  <button class="filter-btn" onclick="filter('instagram',this)">Instagram</button>
  <button class="filter-btn" onclick="filter('linkedin',this)">LinkedIn</button>
  <div class="filter-sep"></div>
  <button class="filter-btn" onclick="filter('pendente',this)">A fazer</button>
  <button class="filter-btn" onclick="filter('producao',this)">Em produção</button>
  <button class="filter-btn" onclick="filter('concluido',this)">Concluídos</button>
  <div class="filter-sep"></div>
  <input class="search-box" id="searchBox" placeholder="Buscar..." oninput="search()">
</div>

<div class="main" id="main"></div>

<script>
const posts = [
  // SEMANA 1
  {
    id:1, semana:1, dia:"06", canal:"instagram", linha:"Estrutura de Crescimento",
    titulo:"O que o seu ecossistema comunica antes de você falar",
    formato:"Carrossel — 8 cards",
    cards:[
      {n:"Card 1 — Capa", t:"O que o seu ecossistema comunica antes de você falar.\n\nAntes da primeira consulta. Antes da primeira mensagem.\nAntes de qualquer palavra."},
      {n:"Card 2", t:"Um médico que prescreve cannabis medicinal pode ter o melhor protocolo do Brasil.\n\nMas se o ecossistema que o cerca — perfil, posicionamento, comunicação, captação — envia sinais errados, o paciente certo nunca vai chegar.\n\nE o paciente errado vai continuar chegando."},
      {n:"Card 3", t:"Ecossistema não é sinônimo de presença digital.\n\nEcossistema é o conjunto de percepções que alguém constrói sobre você antes de te contratar ou te consultar.\n\nInclui o que você publica. O que você não publica. Como você é encontrado. Como você é descrito. Como você posiciona o que faz."},
      {n:"Card 4", t:"A maioria dos médicos de cannabis medicinal tem um problema que não é de conteúdo.\n\nÉ de arquitetura.\n\nNão falta post. Falta estrutura. Não falta frequência. Falta direção. Não falta esforço. Falta coerência entre o que se é e o que se comunica."},
      {n:"Card 5", t:"Quando o ecossistema está desorganizado, três coisas acontecem:\n\nO paciente que chega não é o paciente certo.\nA autoridade percebida não reflete a autoridade real.\nO crescimento depende de sorte — não de método."},
      {n:"Card 6", t:"Quando o ecossistema está estruturado, o oposto:\n\nA captação começa a ser qualificada.\nA reputação é protegida sem depender de performance diária.\nO crescimento tem fundamento — não flutuação."},
      {n:"Card 7", t:"Reorganizar um ecossistema não começa por contratar alguém para postar.\n\nComeça por entender qual é o modelo de crescimento correto para esse médico, nesse momento, com esse perfil, nesse mercado.\n\nEssa leitura é o que diferencia estruturação estratégica de execução tática."},
      {n:"Card 8 — CTA", t:"Se você olha para o seu ecossistema hoje e sente que algo não está coerente — que o esforço não está virando resultado — essa percepção merece ser investigada.\n\nO link está na bio."},
    ],
    legenda:"Existe um momento em que o médico percebe que o problema não é postar mais.\n\nÉ que o que está sendo comunicado não está alinhado com o que ele é — nem com o que ele quer construir.\n\nEsse momento é o começo de uma reorganização estratégica.\n\nO que o seu ecossistema comunica antes de você falar?",
    hashtags:"#cannabismedicinal #estratégiadigital #medicobrasileiro #posicionamentomedico #crescimentoprofissional #socialcann #ecossistemaestratégico #autoridademedica"
  },
  {
    id:2, semana:1, dia:"08", canal:"linkedin", linha:"Diagnóstico Estratégico",
    titulo:"O médico que cresce sem estrutura cresce apesar de si mesmo",
    formato:"Post LinkedIn — texto longo",
    cards:[
      {n:"Post completo", t:"Existe um padrão que aparece com frequência no mercado de cannabis medicinal.\n\nO médico cresceu. Tem pacientes. Tem audiência. Tem reputação no setor.\n\nMas o crescimento aconteceu de forma desordenada — empurrado por demanda, não puxado por posicionamento.\n\nE agora ele está preso em um modelo que não escolheu.\n\nAtende quem chega — não quem deveria atender.\nComunica o que tem tempo — não o que constrói autoridade.\nCapta por indicação — sem sistema, sem previsibilidade.\n\nEsse médico não tem um problema de conteúdo.\nTem um problema de arquitetura de crescimento.\n\nA diferença entre os dois é decisiva:\n\nQuem resolve o problema de conteúdo continua publicando mais.\nQuem resolve o problema de arquitetura reconstrói o modelo.\n\nNo segundo caso, o crescimento para de depender de performance diária — e começa a ter estrutura, fundamento, coerência.\n\nSe você reconhece esse padrão, vale a pena parar e mapear o que está sustentando o seu crescimento — e o que está freando.\n\nEssa leitura é o que fazemos no Diagnóstico Estratégico da Social Cann."}
    ],
    legenda:"O médico que cresce sem estrutura cresce apesar de si mesmo.\n\nEm algum momento, o modelo que sustentou o início deixa de ser suficiente.\n\nE reconhecer esse momento antes que ele cobre seu preço — isso é estratégia.",
    hashtags:"#cannabismedicinal #estratégiadigital #crescimentomedico #diagnóstico #socialcann #posicionamento #medicodigital #autoridadeclinica"
  },
  // SEMANA 2
  {
    id:3, semana:2, dia:"13", canal:"instagram", linha:"Diagnóstico Estratégico",
    titulo:"O problema não está onde você está procurando",
    formato:"Carrossel — 8 cards",
    cards:[
      {n:"Card 1 — Capa", t:"O problema não está onde você está procurando.\n\nE por isso as soluções que você já tentou não resolveram."},
      {n:"Card 2", t:"A maioria dos médicos de cannabis medicinal que busca apoio de comunicação ou estratégia digital começa com a mesma hipótese:\n\n\"Preciso postar mais.\"\n\"Meu problema é o algoritmo.\"\n\"Preciso de alguém para gerenciar minhas redes.\"\n\nEssas hipóteses raramente são a causa real do problema."},
      {n:"Card 3", t:"Na maior parte dos casos, o diagnóstico real é diferente:\n\nO médico está comunicando para o público errado.\nOu está posicionado de forma vaga demais para atrair o paciente certo.\nOu tem autoridade real que não se traduz em autoridade percebida.\nOu cresceu rápido demais e o modelo que sustentou o início já não comporta o momento atual."},
      {n:"Card 4", t:"Quando o problema não é diagnosticado corretamente, o investimento vai para o lugar errado.\n\nContrata-se gestão de redes sociais. O perfil fica mais bonito. O volume aumenta. O resultado permanece o mesmo.\n\nNão porque a execução foi ruim. Mas porque a execução não era o que precisava mudar."},
      {n:"Card 5", t:"Um diagnóstico estratégico não é uma análise de métricas.\n\nÉ uma leitura do sistema:\nComo o médico está posicionado e o que isso está atraindo.\nOnde está o desalinhamento entre esforço e resultado.\nQual o modelo de crescimento mais coerente para esse momento.\nO que precisa ser reorganizado antes de qualquer execução."},
      {n:"Card 6", t:"O diagnóstico não começa pelo perfil.\nComeça pelo médico.\n\nPelo que ele quer construir. Pelo tipo de prática que faz sentido para ele. Pela reputação que ele quer proteger. Pelo crescimento que ele consegue sustentar sem comprometer a qualidade do que entrega."},
      {n:"Card 7", t:"Só depois de ter essa leitura clara é possível dizer:\n\nO que precisa mudar no posicionamento.\nQual modelo de captação faz sentido.\nComo a comunicação deve ser organizada.\nQual é o próximo passo mais inteligente.\n\nSem essa leitura, qualquer solução é um chute qualificado."},
      {n:"Card 8 — CTA", t:"Se você tem a sensação de que está investindo esforço sem o retorno que esperava — isso é um sinal de que o diagnóstico ainda não foi feito.\n\nO link para conversar está na bio."},
    ],
    legenda:"Existe uma diferença entre investir em solução e investir em diagnóstico.\n\nA maioria pula direto para a solução — e descobre mais tarde que estava resolvendo o problema errado.\n\nO diagnóstico não é o passo antes da estratégia.\nÉ o passo que garante que a estratégia vai resolver o que precisa ser resolvido.",
    hashtags:"#cannabismedicinal #diagnósticoestrategico #estratégiamedica #posicionamento #socialcann #crescimentomedico #autoridademedica #medicodigital"
  },
  {
    id:4, semana:2, dia:"15", canal:"linkedin", linha:"Leitura de Mercado",
    titulo:"O mercado de cannabis medicinal no Brasil está crescendo. Mas nem todo crescimento distribui oportunidades igualmente.",
    formato:"Post LinkedIn — análise de mercado",
    cards:[
      {n:"Post completo", t:"O mercado de cannabis medicinal no Brasil está crescendo.\nMas nem todo crescimento distribui oportunidades igualmente.\n\nAlguns médicos estão capturando esse crescimento com estrutura — posicionamento claro, captação coerente, reputação construída com critério.\n\nOutros estão crescendo pelo volume — mais pacientes, mais demanda, mais pressão operacional, sem que o modelo de negócio tenha evoluído no mesmo ritmo.\n\nE há um terceiro grupo: médicos com autoridade real, reconhecimento no setor, repertório técnico consistente — mas que ainda não traduzem esse ativo em crescimento sustentável.\n\nA diferença entre os três grupos raramente é de competência clínica.\nÉ de modelo estratégico.\n\nO médico que estruturou o crescimento antes de a demanda chegar está em posição diferente de quem está correndo atrás da demanda hoje.\n\nNesse mercado em aceleração, a janela para construir posicionamento com método — antes que o espaço fique mais disputado — ainda está aberta.\n\nMas não estará para sempre."}
    ],
    legenda:"O crescimento de um mercado não beneficia todos os seus players da mesma forma.\n\nBeneficia quem estava posicionado para capturá-lo.\n\nConstruir esse posicionamento é uma decisão estratégica — não um resultado automático de ter boa clínica.",
    hashtags:"#cannabismedicinal #mercadocanabico #estratégiadigital #posicionamentomedico #socialcann #crescimentoprofissional #autoridadeclinica #medicobrasileiro"
  },
  {
    id:5, semana:2, dia:"17", canal:"instagram", linha:"Reputação e Autoridade",
    titulo:"Autoridade percebida não é o mesmo que autoridade real",
    formato:"Carrossel — 8 cards",
    cards:[
      {n:"Card 1 — Capa", t:"Autoridade percebida não é o mesmo que autoridade real.\n\nE a distância entre as duas tem um custo que a maioria não calcula."},
      {n:"Card 2", t:"Existe uma quantidade enorme de médicos competentes no mercado de cannabis medicinal que são sistematicamente menos valorizados do que deveriam ser.\n\nNão porque não sabem o suficiente. Mas porque o que sabem não está sendo percebido com a intensidade que merece."},
      {n:"Card 3", t:"Autoridade real é construída por anos de prática clínica, atualização técnica, casos complexos, decisões difíceis e resultado consistente.\n\nAutoridade percebida é construída por como esse repertório é comunicado, posicionado e sustentado ao longo do tempo.\n\nAs duas precisam caminhar juntas. Quando não caminham, há desperdício."},
      {n:"Card 4", t:"O desperdício tem formas concretas:\n\nO médico recebe menos do que vale porque o mercado não percebe o nível do que ele entrega.\nOs pacientes que chegam não são os que fariam melhor uso do que ele oferece.\nAs oportunidades de referência, parceria e expansão passam para quem comunica melhor — não necessariamente para quem sabe mais."},
      {n:"Card 5", t:"No mercado de cannabis medicinal, esse fenômeno é amplificado por uma característica específica do setor:\n\nA sensibilidade reputacional é alta.\nO espaço para erro de comunicação é pequeno.\nE a percepção de autoridade é construída de forma mais lenta — porque precisa ser construída com critério."},
      {n:"Card 6", t:"Construir autoridade percebida nesse mercado não é uma questão de performance ou volume.\n\nÉ uma questão de coerência:\nEntre o que se sabe e o que se comunica.\nEntre o que se entrega e o que o mercado percebe.\nEntre o que se quer ser e como se está sendo visto."},
      {n:"Card 7", t:"Proteger reputação enquanto se constrói autoridade é parte do trabalho.\n\nNesse setor, crescer rápido demais sem atenção reputacional pode custar mais do que crescer com método. A velocidade, sem fundamento, gera fragilidade — não posição."},
      {n:"Card 8 — CTA", t:"A pergunta que vale fazer: o que o mercado percebe sobre você reflete quem você realmente é?\n\nSe a resposta é não — ou se você não sabe — isso merece atenção.\n\nO link está na bio."},
    ],
    legenda:"Existe uma pergunta que médicos de cannabis medicinal raramente fazem sobre si mesmos:\n\nO que o mercado percebe de mim reflete quem eu realmente sou?\n\nA diferença entre autoridade real e autoridade percebida é onde muitos médicos estão perdendo terreno — sem perceber.",
    hashtags:"#cannabismedicinal #autoridademedica #reputacaoclinica #posicionamento #socialcann #medicodigital #estratégiamedica #crescimentoprofissional"
  },
  // SEMANA 3
  {
    id:6, semana:3, dia:"20", canal:"instagram", linha:"Captação Qualificada",
    titulo:"O paciente errado não é acidente. É efeito de posicionamento.",
    formato:"Carrossel — 8 cards",
    cards:[
      {n:"Card 1 — Capa", t:"O paciente errado não é acidente.\nÉ efeito de posicionamento."},
      {n:"Card 2", t:"Quando um médico se queixa de que os pacientes que chegam não são os que ele quer atender — a queixa raramente está errada.\n\nMas a explicação que acompanha a queixa quase sempre aponta para o lugar errado:\n\n\"O algoritmo não me ajuda.\"\n\"Preciso de mais seguidores.\"\n\"As pessoas não entendem o que eu faço.\""},
      {n:"Card 3", t:"O algoritmo não define qual paciente chega.\nO posicionamento define.\n\nO que você comunica sobre o que faz, para quem faz, de que forma faz — isso filtra a demanda antes que ela chegue até você.\n\nE quando esse filtro está calibrado de forma vaga ou incorreta, os pacientes que chegam são um reflexo direto disso."},
      {n:"Card 4", t:"Captação qualificada não é uma questão de anúncio.\nÉ uma questão de arquitetura.\n\nComeça no posicionamento — em como o médico define e comunica para quem ele atende e o que o diferencia.\n\nPassa pela comunicação — que envia sinais específicos para um público específico.\n\nChega na captação — que é o resultado dessas decisões anteriores, não o ponto de partida."},
      {n:"Card 5", t:"Quando o posicionamento está claro:\n\nA demanda que chega já está pré-filtrada.\nA consulta começa com expectativa alinhada.\nO atendimento flui com mais qualidade.\nA reputação é protegida — porque o médico está atendendo quem consegue atender bem."},

const STATUS_KEY = 'sc_cal_status_v1';
let statusMap = JSON.parse(localStorage.getItem(STATUS_KEY) || '{}');
let activeFilter = 'todos';
let searchQuery = '';

function saveStatus() { localStorage.setItem(STATUS_KEY, JSON.stringify(statusMap)); updateHeader(); }
function getStatus(id) { return statusMap[id] || 'pendente'; }
function cycleStatus(id, btn) {
  const s = getStatus(id);
  const next = s === 'pendente' ? 'producao' : s === 'producao' ? 'concluido' : 'pendente';
  statusMap[id] = next;
  saveStatus();
  renderStatusBtn(btn, next);
  renderCards();
}

function renderStatusBtn(btn, status) {
  const labels = { pendente: '○ A fazer', producao: '◑ Em produção', concluido: '● Concluído' };
  btn.textContent = labels[status];
  btn.className = 'status-btn' + (status === 'concluido' ? ' done' : status === 'producao' ? ' prod' : '');
}

function updateHeader() {
  const done = Object.values(statusMap).filter(v => v === 'concluido').length;
  document.getElementById('hDone').textContent = done;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  });
}

function toggleCard(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  const open = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

function filter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function search() {
  searchQuery = document.getElementById('searchBox').value.toLowerCase();
  renderCards();
}

function lineTagClass(linha) {
  const map = {
    'Estrutura de Crescimento': 'l1', 'Diagnóstico Estratégico': 'l2',
    'Leitura de Mercado': 'l3', 'Reputação e Autoridade': 'l4',
    'Captação Qualificada': 'l4', 'Posicionamento Estratégico': 'l3',
    'Comunicação Estratégica': 'l2', 'Reputação': 'l4'
  };
  return 'tag-' + (map[linha] || 'l1');
}

function buildCard(p) {
  const status = getStatus(p.id);
  const statusLabel = { pendente: '○ A fazer', producao: '◑ Em produção', concluido: '● Concluído' }[status];
  const statusClass = { pendente: '', producao: ' prod', concluido: ' done' }[status];
  const canal = p.canal === 'instagram' ? 'Instagram' : 'LinkedIn';
  const canalTag = p.canal === 'instagram' ? 'tag-ig' : 'tag-li';

  const slidesHTML = p.cards.map((c, i) => `
    <div class="post-slide">
      <div class="slide-num">${c.n}</div>
      <div class="slide-text">${c.t.replace(/\n/g,'<br>')}</div>
    </div>`).join('');

  const allCards = p.cards.map(c => c.n + '\n' + c.t).join('\n\n---\n\n');

  return `<div class="post-card" id="card-${p.id}" data-canal="${p.canal}" data-status="${status}">
    <div class="card-header" onclick="toggleCard(${p.id})">
      <div class="card-date">${p.dia}</div>
      <div class="card-meta">
        <div class="card-title">${p.titulo}</div>
        <div class="card-tags">
          <span class="tag ${canalTag}">${canal}</span>
          <span class="tag tag-l1" style="opacity:.6;font-size:9px">${p.formato}</span>
          <span class="tag ${lineTagClass(p.linha)}">${p.linha}</span>
        </div>
      </div>
      <div class="card-toggle" id="arrow-${p.id}">▾</div>
    </div>
    <div class="card-body" id="body-${p.id}">
      <div class="card-section">
        <div class="section-label">Cards / Conteúdo</div>
        <div class="cards-grid">${slidesHTML}</div>
        <div class="copy-row">
          <button class="copy-btn" onclick="copyText(${JSON.stringify(allCards)}, this)">Copiar todos os cards</button>
        </div>
      </div>
      <div class="card-section">
        <div class="section-label">Legenda Instagram / LinkedIn</div>
        <div class="legenda-box">
          <div class="legenda-text">${p.legenda.replace(/\n/g,'<br>')}</div>
          <div class="hashtags">${p.hashtags}</div>
        </div>
        <div class="copy-row">
          <button class="copy-btn" onclick="copyText(${JSON.stringify(p.legenda + '\n\n' + p.hashtags)}, this)">Copiar legenda + hashtags</button>
          <button class="copy-btn" onclick="copyText(${JSON.stringify(allCards + '\n\n---\nLEGENDA:\n' + p.legenda + '\n\n' + p.hashtags)}, this)">Copiar tudo</button>
        </div>
      </div>
    </div>
    <div class="status-row">
      <span class="status-label">Status:</span>
      <button class="status-btn${statusClass}" onclick="cycleStatus(${p.id}, this)">${statusLabel}</button>
    </div>
  </div>`;
}

function renderCards() {
  const main = document.getElementById('main');
  let filtered = posts.filter(p => {
    const s = getStatus(p.id);
    if (activeFilter === 'instagram' && p.canal !== 'instagram') return false;
    if (activeFilter === 'linkedin' && p.canal !== 'linkedin') return false;
    if (activeFilter === 'pendente' && s !== 'pendente') return false;
    if (activeFilter === 'producao' && s !== 'producao') return false;
    if (activeFilter === 'concluido' && s !== 'concluido') return false;
    if (searchQuery && !p.titulo.toLowerCase().includes(searchQuery) && !p.linha.toLowerCase().includes(searchQuery)) return false;
    return true;
  });

  if (!filtered.length) {
    main.innerHTML = '<div class="no-results">Nenhum post encontrado para esse filtro.</div>';
    return;
  }

  const bySemana = {};
  filtered.forEach(p => {
    if (!bySemana[p.semana]) bySemana[p.semana] = [];
    bySemana[p.semana].push(p);
  });

  const semanaInfo = {
    1: { dates: '06 – 10 mai', theme: 'Ecossistema e presença digital' },
    2: { dates: '13 – 17 mai', theme: 'Diagnóstico e mercado' },
    3: { dates: '20 – 24 mai', theme: 'Captação e comunicação' },
    4: { dates: '27 – 31 mai', theme: 'Crescimento sustentável' },
    5: { dates: 'Fim de maio / Transição', theme: 'Identidade da Social Cann' },
  };

  let html = '';
  Object.keys(bySemana).sort().forEach(sem => {
    const info = semanaInfo[sem] || {};
    html += `<div class="week-head">
      <div class="week-num">S${sem}</div>
      <div>
        <div class="week-theme">${info.theme || ''}</div>
        <div class="week-dates">${info.dates || ''}</div>
      </div>
    </div>`;
    bySemana[sem].forEach(p => { html += buildCard(p); });
  });

  main.innerHTML = html;
}

renderCards();
updateHeader();
</script>
</body>
</html>

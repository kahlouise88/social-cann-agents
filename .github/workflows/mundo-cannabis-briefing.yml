name: Mundo Cannabis Briefing Agent

on:
  schedule:
    # Runs on Wednesday and Friday at 6:00 AM UTC (3:00 AM BRT)
    - cron: '0 6 * * 3,5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mundo Cannabis Briefing Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python agents/mundo_cannabis_briefing.py

      - name: Log workflow completion
        if: always()
        run: echo "Mundo Cannabis Briefing Agent workflow completed at $(date)"

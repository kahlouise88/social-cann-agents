name: Cannabis Market Updates Agent

on:
  schedule:
    # Runs on the 1st and 15th of every month at 6:00 AM UTC (3:00 AM BRT)
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cannabis Market Updates Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agents/cannabis_market_updates.py

      - name: Log workflow completion
        if: always()
        run: echo "Cannabis Market Updates Agent workflow completed at $(date)"
